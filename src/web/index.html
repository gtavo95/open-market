<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Open Market</title>
<style>
  :root {
    --paper: #f6f3ea; --card: #fffdf7; --ink: #23291f; --soft: #68705f; --line: #ddd7c6;
    --leaf: #2f6b3a; --leaf-ink: #fbfaf3; --warn: #a3401f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #171a15; --card: #20241d; --ink: #eceadf; --soft: #a0a795; --line: #363b30;
      --leaf: #5da86b; --leaf-ink: #10140e; --warn: #e58a68;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; height: 100dvh; background: var(--paper); color: var(--ink);
    font: 16px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
  header div, #log, form { width: 100%; max-width: 720px; margin: 0 auto; }
  h1 { margin: 0; font-size: 18px; letter-spacing: -.01em; }
  header p { margin: 2px 0 0; color: var(--soft); font-size: 14px; }
  main { flex: 1; overflow-y: auto; padding: 16px; }
  #log { display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 86%; padding: 9px 13px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .me { align-self: flex-end; background: var(--leaf); color: var(--leaf-ink); border-bottom-right-radius: 4px; }
  .bot { align-self: flex-start; background: var(--card); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .me img { display: block; max-width: 220px; max-height: 220px; border-radius: 8px; margin-bottom: 6px; }
  .note { align-self: flex-start; max-width: 86%; color: var(--soft); font-size: 13px; }
  .note.right { align-self: flex-end; text-align: right; }
  .note.error { color: var(--warn); }
  .starters { display: flex; flex-wrap: wrap; gap: 8px; }
  .starters button { font-size: 14px; min-height: 36px; }
  footer { padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }
  #attached { display: none; align-items: center; gap: 8px; margin-bottom: 8px; color: var(--soft); font-size: 14px; }
  #attached img { height: 44px; border-radius: 6px; }
  form { display: flex; gap: 8px; align-items: flex-end; }
  textarea {
    flex: 1; min-width: 0; min-height: 44px; max-height: 130px; resize: none; padding: 10px 12px;
    font: inherit; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  }
  button, label.btn {
    display: inline-flex; align-items: center; justify-content: center; min-width: 44px; min-height: 44px;
    padding: 0 12px; font: inherit; color: var(--ink); background: var(--card);
    border: 1px solid var(--line); border-radius: 12px; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  button.send { background: var(--leaf); color: var(--leaf-ink); border-color: var(--leaf); }
  button.on { background: var(--warn); color: var(--leaf-ink); border-color: var(--warn); }
  :focus-visible { outline: 2px solid var(--leaf); outline-offset: 2px; }
  input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }
</style>
</head>
<body>
<header><div>
  <h1>Open Market</h1>
  <p>A farm-input advisor. Ask, send a photo of the pest, or leave a voice note.</p>
</div></header>
<main id="scroll"><div id="log" aria-live="polite"></div></main>
<footer>
  <div id="attached" style="max-width:720px;margin:0 auto 8px">
    <img id="thumb" alt="Photo to send"><span id="attachedName"></span>
    <button type="button" id="drop" aria-label="Remove attachment">Remove</button>
  </div>
  <form id="form">
    <label class="btn" title="Send a photo">Photo
      <input id="photo" type="file" accept="image/*" aria-label="Send a photo">
    </label>
    <button type="button" id="mic" title="Record a voice note">Voice</button>
    <textarea id="text" rows="1" maxlength="2000" placeholder="Write your question" aria-label="Your message"></textarea>
    <button class="send" id="send">Send</button>
  </form>
</footer>
<script>
const $ = id => document.getElementById(id);
const log = $("log"), scroll = $("scroll");
const MAX_SIDE = 1280, MAX_SECONDS = 60, RATE = 16000;
const STARTERS = [
  "Worms are eating my corn leaves, what do you have?",
  "I want to buy fertilizer for tomato",
  "Which products do you sell for whitefly?",
];

let session;
try { session = localStorage.getItem("session"); } catch {}
if (!session) {
  session = crypto.randomUUID();
  try { localStorage.setItem("session", session); } catch {}
}

let image = "", audio = "", recorder = null, stopTimer = 0;

function add(cls, text) {
  const el = document.createElement("div");
  el.className = cls;
  if (text) el.textContent = text;
  log.append(el);
  scroll.scrollTop = scroll.scrollHeight;
  return el;
}

function starters() {
  const row = add("starters");
  for (const s of STARTERS) {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = s;
    b.onclick = () => { row.remove(); $("text").value = s; send(); };
    row.append(b);
  }
}

function attached(label, src) {
  $("attached").style.display = label ? "flex" : "none";
  $("attachedName").textContent = label;
  $("thumb").style.display = src ? "block" : "none";
  if (src) $("thumb").src = src;
}

function clearAttachments() { image = ""; audio = ""; $("photo").value = ""; attached(""); }

/* A phone photo is 5 MB; the model reads a pest as well at 1280 px. */
async function shrink(file) {
  const bitmap = await createImageBitmap(file);
  const scale = Math.min(1, MAX_SIDE / Math.max(bitmap.width, bitmap.height));
  const canvas = document.createElement("canvas");
  canvas.width = Math.round(bitmap.width * scale);
  canvas.height = Math.round(bitmap.height * scale);
  canvas.getContext("2d").drawImage(bitmap, 0, 0, canvas.width, canvas.height);
  return canvas.toDataURL("image/jpeg", 0.85);
}

$("photo").onchange = async e => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    image = await shrink(file);
    attached("Photo ready", image);
  } catch {
    add("note error", "That image could not be opened. Try a JPEG or PNG.");
  }
};
$("drop").onclick = clearAttachments;

/* Browsers record webm or mp4. The API was tried with WAV, so the page converts: 16 kHz mono PCM. */
async function toWav(blob) {
  const raw = await blob.arrayBuffer();
  const ctx = new OfflineAudioContext(1, 1, RATE);
  const decoded = await ctx.decodeAudioData(raw);
  const frames = Math.ceil(decoded.duration * RATE);
  const offline = new OfflineAudioContext(1, frames, RATE);
  const source = offline.createBufferSource();
  source.buffer = decoded;
  source.connect(offline.destination);
  source.start();
  const pcm = (await offline.startRendering()).getChannelData(0);

  const out = new DataView(new ArrayBuffer(44 + pcm.length * 2));
  const tag = (at, s) => [...s].forEach((c, i) => out.setUint8(at + i, c.charCodeAt(0)));
  tag(0, "RIFF"); out.setUint32(4, 36 + pcm.length * 2, true); tag(8, "WAVEfmt ");
  out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, 1, true);
  out.setUint32(24, RATE, true); out.setUint32(28, RATE * 2, true);
  out.setUint16(32, 2, true); out.setUint16(34, 16, true);
  tag(36, "data"); out.setUint32(40, pcm.length * 2, true);
  pcm.forEach((v, i) => out.setInt16(44 + i * 2, Math.max(-1, Math.min(1, v)) * 32767, true));

  let binary = "";
  const bytes = new Uint8Array(out.buffer);
  for (let i = 0; i < bytes.length; i += 32768) binary += String.fromCharCode(...bytes.subarray(i, i + 32768));
  return btoa(binary);
}

$("mic").onclick = async () => {
  if (recorder) { recorder.stop(); return; }
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch {
    add("note error", "The microphone is blocked. Allow it in the browser and try again.");
    return;
  }
  const chunks = [];
  recorder = new MediaRecorder(stream);
  recorder.ondataavailable = e => chunks.push(e.data);
  recorder.onstop = async () => {
    clearTimeout(stopTimer);
    stream.getTracks().forEach(t => t.stop());
    recorder = null;
    $("mic").classList.remove("on");
    $("mic").textContent = "Voice";
    try {
      audio = await toWav(new Blob(chunks, { type: chunks[0]?.type }));
      send();
    } catch {
      add("note error", "That recording could not be read. Try again.");
    }
  };
  recorder.start();
  $("mic").classList.add("on");
  $("mic").textContent = "Stop";
  stopTimer = setTimeout(() => recorder?.stop(), MAX_SECONDS * 1000);
};

async function send() {
  const text = $("text").value.trim();
  if (!text && !image && !audio) return;
  log.querySelector(".starters")?.remove();

  const mine = add("msg me");
  if (image) { const img = new Image(); img.src = image; img.alt = "Photo you sent"; mine.append(img); }
  if (text) mine.append(text);
  if (audio && !text && !image) mine.textContent = "Voice note";
  else if (audio) mine.append(" + voice note");

  const body = { session, text, image, audio };
  $("text").value = "";
  clearAttachments();
  $("send").disabled = true;
  const waiting = add("note", image || audio ? "Reading what you sent, then checking the datasheets…" : "Checking the datasheets…");

  try {
    const r = await fetch("/chat", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
    });
    const data = await r.json().catch(() => ({}));
    waiting.remove();
    if (!r.ok) {
      const detail = typeof data.detail === "string" ? data.detail : "The advisor could not answer. Try again.";
      add("note error", detail);
      return;
    }
    if (data.heard) add("note right", `Heard: ${data.heard}`);
    if (data.seen) add("note right", `Seen in the photo: ${data.seen}`);
    for (const m of data.messages) add("msg bot", m);
    const from = data.sources.length ? `From ${data.sources.join(", ")}. ` : "";
    add("note", `${from}${data.seconds} s, ${data.tokens.toLocaleString("en-US")} tokens`);
  } catch {
    waiting.remove();
    add("note error", "The connection dropped. Try again.");
  } finally {
    $("send").disabled = false;
  }
}

$("form").onsubmit = e => { e.preventDefault(); send(); };
$("text").onkeydown = e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
};
add("msg bot", "Hi. Tell me what is happening in your crop, or send me a photo of it.");
starters();
</script>
</body>
</html>
